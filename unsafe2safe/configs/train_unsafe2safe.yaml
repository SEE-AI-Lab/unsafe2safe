# Example Unsafe2Safe Stage 2 training configuration.
# Run it with unsafe2safe/scripts/train_unsafe2safe.sh and an external
# InstructPix2Pix checkout. Keep data and checkpoints outside Git.
# The model passes c_crossattn as (public caption, edit instruction).
# This is one representative recipe; adjust local paths and resource settings
# here instead of maintaining separate config files for every run.

model:
  base_learning_rate: 1.0e-05
  target: unsafe2safe.model.Unsafe2Safe
  params:
    ckpt_path: checkpoints/magicbrush.ckpt
    linear_start: 0.00085
    linear_end: 0.0120
    num_timesteps_cond: 1
    log_every_t: 200
    timesteps: 1000
    first_stage_key: image_public
    cond_stage_key: caption_edit
    image_size: 32
    channels: 4
    cond_stage_trainable: false
    conditioning_key: hybrid
    monitor: val/loss_simple
    scale_factor: 0.18215
    use_ema: true
    load_ema: false

    scheduler_config:
      target: ldm.lr_scheduler.LambdaLinearScheduler
      params:
        warm_up_steps: [0]
        cycle_lengths: [10000000000000]
        f_start: [1.0e-6]
        f_max: [1.0]
        f_min: [1.0]

    unet_config:
      target: ldm.modules.diffusionmodules.openaimodel.UNetModel
      params:
        image_size: 32
        in_channels: 8
        out_channels: 4
        model_channels: 320
        attention_resolutions: [4, 2, 1]
        num_res_blocks: 2
        channel_mult: [1, 2, 4, 4]
        num_heads: 8
        use_spatial_transformer: true
        transformer_depth: 1
        context_dim: 768
        use_checkpoint: true
        legacy: false

    first_stage_config:
      target: ldm.models.autoencoder.AutoencoderKL
      params:
        embed_dim: 4
        monitor: val/rec_loss
        ddconfig:
          double_z: true
          z_channels: 4
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult: [1, 2, 4, 4]
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0
        lossconfig:
          target: torch.nn.Identity

    cond_stage_config:
      target: ldm.modules.encoders.modules.FrozenCLIPEmbedder

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 64
    num_workers: 8
    train:
      target: unsafe2safe.data.EditDataset
      params:
        path: data/unsafe
        target_path: data/safe
        csv_path: metadata/triplets.csv
        file_column: file
        public_caption_column: public_caption
        edit_caption_column: edit_instruction
        clip_score_path: null
        split: train
        min_resize_res: 256
        max_resize_res: 256
        crop_res: 256
        flip_prob: 0.5
    validation:
      target: unsafe2safe.data.EditDataset
      params:
        path: data/unsafe
        target_path: data/safe
        csv_path: metadata/triplets.csv
        file_column: file
        public_caption_column: public_caption
        edit_caption_column: edit_instruction
        clip_score_path: null
        split: val
        min_resize_res: 256
        max_resize_res: 256
        crop_res: 256

lightning:
  callbacks:
    image_logger:
      target: main.ImageLogger
      params:
        batch_frequency: 2000
        max_images: 2
        increase_log_steps: false
  trainer:
    max_epochs: 200
    benchmark: true
    accumulate_grad_batches: 4
    check_val_every_n_epoch: 4
