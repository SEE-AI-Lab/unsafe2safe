<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1b3d">
  <title>SafeFrame — photo editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme:light; --navy:#0d1b3d; --red:#d7262d; --paper:#f2f2f0; --white:#fff; --purple:#4b2e83; --ink:#152442; --muted:#58677d; --line:#d5dbe3; --wash:#e8edf2 }
    * { box-sizing:border-box }
    body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.45 'DM Sans',sans-serif }
    button, input { font:inherit }
    button:focus-visible, a:focus-visible { outline:3px solid #b676d1; outline-offset:3px }
    header { min-height:68px; background:var(--navy); color:white; display:flex; align-items:center; padding:0 max(24px,calc((100vw - 1316px)/2)) }
    .brand { font-size:20px; font-weight:700; letter-spacing:-.03em }
    .brand-mark { color:#ef5449; margin-right:4px }
    main { max-width:1440px; margin:auto; padding:32px max(24px,calc((100vw - 1316px)/2)) 40px }
    h1 { margin:0 0 16px; color:var(--navy); font:700 36px/1 'Barlow Condensed',sans-serif; letter-spacing:.015em }
    .workspace { display:grid; grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr); gap:18px; align-items:stretch }
    .panel { min-width:0; background:var(--white); border:1px solid var(--line); padding:19px; border-radius:4px }
    .panel-heading { margin:0 0 13px; font-size:14px; font-weight:700 }
    .photo { height:270px; display:grid; place-items:center; overflow:hidden; background:var(--wash); color:var(--navy); border:1px dashed #aeb8c5 }
    .photo img, .photo video { display:none; width:100%; height:100%; max-height:360px; object-fit:contain; background:#111 }
    .photo.has-image img, .photo.camera-on video { display:block }
    .photo.has-image .upload-prompt, .photo.camera-on .upload-prompt { display:none }
    .upload-prompt { padding:20px; text-align:center; font-weight:600 }
    .file-input { display:none }
    .photo-actions, .camera-controls { display:flex; gap:8px; margin-top:10px }
    .photo-actions[hidden] { display:none }
    .camera-controls[hidden], .camera-error[hidden] { display:none }
    .camera-error { margin:8px 0 0; color:#a51e24; font-size:13px }
    .button { min-height:42px; border:1px solid var(--red); border-radius:3px; background:var(--red); color:#fff; padding:10px 16px; font-size:13px; font-weight:700; cursor:pointer; transition:background .15s,transform .15s }
    .button:hover { background:#b91f26; transform:translateY(-1px) }
    .button.secondary { border-color:var(--line); background:#fff; color:var(--navy) }
    .button.secondary:hover { border-color:var(--navy); background:#f6f7f8 }
    .button:disabled { border-color:#aeb7c3; background:#aeb7c3; cursor:not-allowed; transform:none }
    .privacy-note { margin:9px 0 0; color:var(--muted); font-size:12px }
    .mode-title { margin:20px 0 9px; font-size:14px }
    .choices { display:grid; gap:7px }
    .choice { width:100%; min-height:61px; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:3px; padding:9px 11px; display:grid; grid-template-columns:18px minmax(0,1fr) auto; align-items:center; gap:10px; text-align:left; cursor:pointer; transition:border-color .15s,background .15s }
    .choice:hover { border-color:#8796ac; background:#fafbfc }
    .choice[aria-pressed="true"] { border:2px solid var(--red); padding:8px 10px; background:#fffafa }
    .radio { width:15px; height:15px; border:1px solid #8797a9; border-radius:50% }
    .choice[aria-pressed="true"] .radio { border:4px solid var(--red) }
    .choice-copy strong { display:block; color:var(--navy); font-size:13px }
    .choice-copy small { display:block; margin-top:2px; color:var(--muted); font-size:12px; line-height:1.35 }
    .actions { display:flex; justify-content:flex-end; margin-top:13px }
    .result-panel { display:flex; flex-direction:column }
    .result-stage { min-height:400px; flex:1; display:grid; place-items:center; overflow:hidden; background:var(--wash); border:1px solid #e1e5e9 }
    .result-stage img { display:none; width:100%; max-height:520px; object-fit:contain }
    .result-empty { max-width:260px; padding:20px; color:var(--muted); font-size:14px; text-align:center }
    .result-empty strong { display:block; margin-bottom:4px; color:var(--navy) }
    .result-stage.processing .result-empty strong { color:var(--purple) }
    .result-caption { display:flex; justify-content:space-between; gap:12px; margin-top:11px; color:var(--muted); font-size:12px }
    #download { display:none; color:var(--navy); font-weight:700; text-decoration:underline; text-underline-offset:3px }
    @media (max-width:850px) { main { padding-top:25px } .workspace { grid-template-columns:1fr } .result-stage { min-height:300px } }
    @media (max-width:560px) {
      header { min-height:58px; padding:0 18px }
      main { padding:22px 14px 30px }
      h1 { font-size:32px }
      .panel { padding:13px }
      .photo { height:230px }
      .photo-actions .button { flex:1 }
      .choice { grid-template-columns:17px minmax(0,1fr) auto; gap:7px; padding:8px }
      .choice[aria-pressed="true"] { padding:7px }
      .actions .button { width:100% }
      .result-stage { min-height:270px }
    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none !important; scroll-behavior:auto !important } }
  </style>
</head>
<body>
  <header><div class="brand"><span class="brand-mark">S</span>SafeFrame</div></header>
  <main>
    <h1>Choose your edit</h1>
    <section class="workspace" aria-label="Photo editor">
      <article class="panel">
        <h2 class="panel-heading">Your photo</h2>
        <div class="photo" id="drop">
          <div class="upload-prompt">Your photo will appear here</div>
          <img id="preview" alt="Selected original photo">
          <video id="cameraPreview" playsinline muted hidden aria-label="Live camera preview"></video>
        </div>
        <div class="photo-actions" id="photoActions">
          <button class="button secondary" id="uploadButton" type="button">Upload a photo</button>
          <button class="button secondary" id="cameraButton" type="button">Take a photo</button>
        </div>
        <div class="camera-controls" id="cameraControls" hidden>
          <button class="button" id="captureButton" type="button">Capture photo</button>
          <button class="button secondary" id="cancelCameraButton" type="button">Cancel</button>
        </div>
        <p class="camera-error" id="cameraError" role="status" aria-live="polite" hidden>Couldn’t open the camera. Upload a photo instead.</p>
        <input class="file-input" id="photo" type="file" accept="image/*">
        <p class="privacy-note">Sent to Gemini for editing. Not saved on this server.</p>
        <h2 class="mode-title">What should change?</h2>
        <div class="choices" role="radiogroup" aria-label="Edit mode">
          <button class="choice" type="button" data-mode="spooky_private" aria-pressed="true">
            <span class="radio" aria-hidden="true"></span><span class="choice-copy"><strong>Spooky, still private</strong><small>Give it a Halloween look and hide identifying details.</small></span>
          </button>
          <button class="choice" type="button" data-mode="diverse_cast" aria-pressed="false">
            <span class="radio" aria-hidden="true"></span><span class="choice-copy"><strong>Broaden the cast</strong><small>Add a wide mix of ages, skin tones, gender expression, and visible abilities.</small></span>
          </button>
          <button class="choice" type="button" data-mode="new_setting" aria-pressed="false">
            <span class="radio" aria-hidden="true"></span><span class="choice-copy"><strong>Take it somewhere else</strong><small>Keep the moment, move it to an unexpected setting.</small></span>
          </button>
        </div>
        <div class="actions"><button class="button" id="edit" disabled>Create this edit</button></div>
      </article>
      <article class="panel result-panel">
        <h2 class="panel-heading">Edited photo</h2>
        <div class="result-stage" id="resultStage"><div class="result-empty" id="placeholder" role="status" aria-live="polite"><strong>Your result appears here</strong>Your edited photo will appear here.</div><img id="resultImage" alt="Gemini edited photo"></div>
        <div class="result-caption"><a id="download" download="safeframe-edited.png">Download edited photo</a></div>
      </article>
    </section>
  </main>
  <script>
    const input = document.getElementById('photo');
    const preview = document.getElementById('preview');
    const cameraPreview = document.getElementById('cameraPreview');
    const photoActions = document.getElementById('photoActions');
    const cameraControls = document.getElementById('cameraControls');
    const cameraError = document.getElementById('cameraError');
    const cameraButton = document.getElementById('cameraButton');
    const edit = document.getElementById('edit');
    const resultImage = document.getElementById('resultImage');
    const resultStage = document.getElementById('resultStage');
    const placeholder = document.getElementById('placeholder');
    let selectedFile;
    let cameraStream;
    let selectedMode = 'spooky_private';

    document.getElementById('uploadButton').addEventListener('click', () => input.click());
    cameraButton.addEventListener('click', startCamera);

    document.querySelectorAll('.choice').forEach((choice) => choice.addEventListener('click', () => {
      selectedMode = choice.dataset.mode;
      document.querySelectorAll('.choice').forEach((item) => item.setAttribute('aria-pressed', String(item === choice)));
    }));

    function stopCamera() {
      if (cameraStream) cameraStream.getTracks().forEach((track) => track.stop());
      cameraStream = null;
      cameraPreview.srcObject = null;
      cameraPreview.hidden = true;
      document.getElementById('drop').classList.remove('camera-on');
      photoActions.hidden = false;
      cameraControls.hidden = true;
    }

    function selectPhoto(file) {
      if (!file) return;
      stopCamera();
      if (preview.src.startsWith('blob:')) URL.revokeObjectURL(preview.src);
      selectedFile = file;
      preview.src = URL.createObjectURL(file);
      document.getElementById('drop').classList.add('has-image');
      edit.disabled = false;
      resultImage.style.display = 'none';
      placeholder.style.display = 'block';
      placeholder.innerHTML = '<strong>Your result appears here</strong>Your edited photo will appear here.';
      resultStage.classList.remove('processing');
      document.getElementById('download').style.display = 'none';
    }

    async function startCamera() {
      cameraButton.disabled = true;
      cameraError.hidden = true;
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
          audio: false
        });
        cameraPreview.srcObject = cameraStream;
        cameraPreview.hidden = false;
        document.getElementById('drop').classList.add('camera-on');
        photoActions.hidden = true;
        cameraControls.hidden = false;
        await cameraPreview.play();
      } catch {
        stopCamera();
        cameraError.hidden = false;
      } finally {
        cameraButton.disabled = false;
      }
    }

    input.addEventListener('change', () => {
      selectPhoto(input.files[0]);
      input.value = '';
    });

    document.getElementById('captureButton').addEventListener('click', () => {
      const canvas = document.createElement('canvas');
      canvas.width = cameraPreview.videoWidth;
      canvas.height = cameraPreview.videoHeight;
      canvas.getContext('2d').drawImage(cameraPreview, 0, 0);
      canvas.toBlob((blob) => {
        if (blob) selectPhoto(new File([blob], 'safeframe-camera.jpg', { type: 'image/jpeg' }));
      }, 'image/jpeg', 0.92);
    });

    document.getElementById('cancelCameraButton').addEventListener('click', stopCamera);

    edit.addEventListener('click', async () => {
      if (!selectedFile) return;
      edit.disabled = true;
      edit.textContent = 'Creating your edit…';
      placeholder.innerHTML = '<strong>Working on your edit</strong>Your photo is being edited.';
      placeholder.style.display = 'block';
      resultImage.style.display = 'none';
      resultStage.classList.add('processing');
      const form = new FormData();
      form.append('photo', selectedFile);
      form.append('mode', selectedMode);
      try {
        const response = await fetch('/edit', { method: 'POST', body: form });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'The edit could not be completed.');
        const url = `data:${data.mime_type};base64,${data.image}`;
        resultImage.src = url;
        resultImage.style.display = 'block';
        placeholder.style.display = 'none';
        resultStage.classList.remove('processing');
        const download = document.getElementById('download');
        download.href = url;
        download.style.display = 'inline';
      } catch (error) {
        placeholder.replaceChildren();
        const title = document.createElement('strong');
        title.textContent = 'Edit failed';
        placeholder.append(title, document.createTextNode(error.message));
        resultStage.classList.remove('processing');
      } finally {
        edit.disabled = false;
        edit.textContent = 'Create this edit';
      }
    });
  </script>
</body>
</html>
