# Shared inference settings. Change these once for all Stage 1 jobs.
defaults:
  run:
    batch_size: 16
    max_new_tokens: 1024
    image_size: 448
    device: cuda
datasets:
  # COCO uses metadata.csv; the other datasets are read from image folders.
  mscoco:
    root_dir: data/mscoco
  vispr:
    root_dir: data/vispr
  caltech:
    root_dir: data/caltech-101
  indoor:
    root_dir: data/indoor

purposes:
  generate_captions:
    run:
      backend: internvl
      model_id: OpenGVLab/InternVL2_5-8B
      system_prompt: You are a vision-language assistant that generates privacy-aware, structured descriptions of real-world images.
      prompt_path: prompts/intern_image_captioning.txt
    source:
      type: csv
      csv_path: metadata/{dataset}.csv
    dataset_overrides:
      vispr:
        source:
          type: glob
      caltech:
        source:
          type: glob
      indoor:
        source:
          type: glob

  generate_flags:
    run:
      backend: internvl
      model_id: OpenGVLab/InternVL2_5-8B
      system_prompt: You are a vision-language assistant for structured, privacy-aware image analysis.
      prompt_path: prompts/intern_image_flagging.txt
      max_new_tokens: 128
    source:
      type: glob

  generate_edit_instructions:
    run:
      backend: qwen_text
      model_id: Qwen/Qwen3-4B-Instruct-2507
      system_prompt: You generate short change descriptions for real-world image captions.
      prompt_path: prompts/qwen_image_captioning-private-expand.txt
      max_new_tokens: 512
      batch_size: 64
    source:
      type: csv
      csv_path: outputs/{dataset}/generate_captions.csv
      prompt_columns:
        public_caption: PUBLIC_CAPTION

  combine_caption_and_edit:
    run:
      backend: qwen_text
      model_id: Qwen/Qwen3-4B-Instruct-2507
      system_prompt: You are a caption rewriting assistant that write coherent yet concise image caption.
      prompt_path: prompts/qwen_caption_combine.txt
      max_new_tokens: 512
      batch_size: 64
    source:
      type: csv
      csv_path: outputs/{dataset}/generate_edit_instructions.csv
      prompt_columns:
        public_caption: PUBLIC_CAPTION
        edit_caption: EDIT_INSTRUCTION
