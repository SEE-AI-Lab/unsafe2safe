active_purpose: compare_anonymization
active_dataset: mscoco

defaults:
  run:
    batch_size: 16
    max_new_tokens: 1024
    image_size: 448
    device: cuda
    cache_dir: .cache/huggingface
  output:
    output_dir: outputs/{dataset}/{purpose}
    filename_suffix: _caption.json

datasets:
  mscoco:
    root_dir: data/mscoco
  vispr:
    root_dir: data/vispr
  caltech:
    root_dir: data/caltech-101
  indoor:
    root_dir: data/indoor

purposes:
  compare_anonymization:
    run:
      backend: internvl_pair
      model_id: OpenGVLab/InternVL3_5-8B
      system_prompt: You are a vision-language evaluator for privacy-preserving image anonymization.
      prompt_path: prompts/intern_image_flagging-compare.txt
      max_new_tokens: 512
    source:
      type: paired_csv
      csv_path: metadata/{dataset}_pairs.csv
      left_image_col: file
      right_image_col: file
      rel_col: file
      right_root_dir: data/{dataset}_anonymized
