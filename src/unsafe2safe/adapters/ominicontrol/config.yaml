# Unsafe2Safe OminiControl reproduction settings.
#
# OminiControl itself is intentionally not vendored by this repository. See
# README.md for the external checkout and installation instructions.
flux_path: "black-forest-labs/FLUX.1-dev"
dtype: "bfloat16"

model:
  independent_condition: false

train:
  batch_size: 4
  accumulate_grad_batches: 1
  dataloader_workers: 5
  save_interval: 1000
  sample_interval: 1000000000
  max_steps: 12000
  gradient_checkpointing: true
  save_path: "runs/ominicontrol"

  dataset:
    csv_path: "data/MSCOCO_Qwen_4B_detailed_face.csv"
    image_root: "data/coco"
    target_root: "data/MSCOCO_private_editted_new"
    clip_score_path: "data/clip_similarity_orig_edit.csv"
    split: "train"
    clip_threshold: 0.7
    image_size: [512, 512]
    drop_text_prob: 0.1
    drop_image_prob: 0.1
    tokenizer_name: "openai/clip-vit-base-patch32"
    max_caption_tokens: 73

  wandb:
    project: "Unsafe2Safe-OminiControl"

  lora_config:
    r: 16
    lora_alpha: 16
    init_lora_weights: "gaussian"
    target_modules: "(.*x_embedder|.*(?<!single_)transformer_blocks\\.[0-9]+\\.norm1\\.linear|.*(?<!single_)transformer_blocks\\.[0-9]+\\.attn\\.to_k|.*(?<!single_)transformer_blocks\\.[0-9]+\\.attn\\.to_q|.*(?<!single_)transformer_blocks\\.[0-9]+\\.attn\\.to_v|.*(?<!single_)transformer_blocks\\.[0-9]+\\.attn\\.to_out\\.0|.*(?<!single_)transformer_blocks\\.[0-9]+\\.ff\\.net\\.2|.*single_transformer_blocks\\.[0-9]+\\.norm\\.linear|.*single_transformer_blocks\\.[0-9]+\\.proj_mlp|.*single_transformer_blocks\\.[0-9]+\\.proj_out|.*single_transformer_blocks\\.[0-9]+\\.attn.to_k|.*single_transformer_blocks\\.[0-9]+\\.attn.to_q|.*single_transformer_blocks\\.[0-9]+\\.attn.to_v|.*single_transformer_blocks\\.[0-9]+\\.attn.to_out)"

  optimizer:
    type: "Prodigy"
    params:
      lr: 1
      use_bias_correction: true
      safeguard_warmup: true
      weight_decay: 0.01
